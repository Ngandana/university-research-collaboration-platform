name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest pytest-cov python-multipart

      - name: Run all tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov=services \
            --cov=api \
            --cov=repositories \
            --cov=creational_patterns \
            --cov=factories \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junit-xml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel fastapi uvicorn httpx

      - name: Create pyproject.toml for packaging
        run: |
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "university-research-collaboration-platform"
          version = "1.0.0"
          description = "University Research Collaboration Platform REST API"
          requires-python = ">=3.12"
          dependencies = [
            "fastapi>=0.100.0",
            "uvicorn>=0.23.0",
            "httpx>=0.24.0",
          ]

          [tool.setuptools.packages.find]
          where = ["."]
          include = ["src*", "services*", "api*", "repositories*", "creational_patterns*", "factories*"]
          EOF

      - name: Build Python wheel
        run: python -m build --wheel --outdir dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ github.sha }}
          path: dist/*.whl
          retention-days: 30
